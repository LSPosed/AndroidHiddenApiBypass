name: Build

on:
  pull_request:
  push:
    branches:
      - 'main'

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest, macOS-latest ]

    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Build with Gradle
        run: |
          echo 'org.gradle.caching=true' >> gradle.properties
          echo 'org.gradle.parallel=true' >> gradle.properties
          echo 'org.gradle.jvmargs=-Xmx2048m' >> gradle.properties
          ./gradlew publishToMavenLocal
        env:
          GIT_CONFIG_NOSYSTEM: true
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.maven_pgp_signingKey }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.maven_pgp_signingPassword }}
      - name: Upload library
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.os }}-library
          path: ~/.m2
          include-hidden-files: true

  test:
    name: Test on API ${{ matrix.api-level }} ${{ matrix.arch }}
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - api-level: 28
            target: default
            arch: x86_64
          - api-level: 28
            target: default
            arch: x86
          - api-level: 29
            target: default
            arch: x86_64
          - api-level: 29
            target: default
            arch: x86
          - api-level: 30
            target: aosp_atd
            arch: x86_64
          - api-level: 30
            target: aosp_atd
            arch: x86
          - api-level: 31
            target: aosp_atd
            arch: x86_64
          - api-level: 31
            target: android-tv
            arch: x86
          - api-level: 32
            target: aosp_atd
            arch: x86_64
          - api-level: 33
            target: aosp_atd
            arch: x86_64
          - api-level: 33
            target: android-tv
            arch: x86
          - api-level: 34
            target: aosp_atd
            arch: x86_64
          - api-level: 35
            target: aosp_atd
            arch: x86_64
          - api-level: 36
            target: aosp_atd
            arch: x86_64
          - api-level: 36
            target: android-tv
            arch: x86
          - api-level: '36.1'
            target: google_apis
            arch: x86_64
          - api-level: '37.0'
            target: google_apis
            arch: x86_64
          - api-level: '37.1'
            target: android-desktop
            arch: x86_64
          - api-level: '37.2'
            target: google_apis_ps16k
            arch: x86_64
          - api-level: CANARY
            target: google_apis_ps16k
            arch: x86_64
    steps:
      - name: checkout
        uses: actions/checkout@v7
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@v2
        with:
          android: false
          tool-cache: true
          dotnet: true
          haskell: true
          swap-storage: true
          docker-images: false
          large-packages: false
          preinstalled-runtimes: false
      - name: run tests
        uses: LSPosed/android-emulator-runner@release/v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: ${{ matrix.arch }}
          target: ${{ matrix.target }}
          channel: canary
          script: |
            ./gradlew connectedCheck -Pandroid.injected.androidTest.leaveApksInstalledAfterRun=true
            ./gradlew connectedCheck -Pandroid.testInstrumentationRunnerArguments.load=true
          force-avd-creation: false
          emulator-options: -no-snapshot -read-only -no-window -gpu swiftshader_indirect -no-audio -no-boot-anim -camera-back none${{ matrix.target == 'google_apis_ps16k' && ' -show-kernel' || '' }}
          pre-emulator-launch-script: ${{ matrix.target == 'google_apis_ps16k' && 'bash .github/capture-emulator-console.sh' || '' }}
          disable-animations: true
          disk-size: 6000M
          heap-size: 600M
          cores: 4
        env:
          GIT_CONFIG_NOSYSTEM: true
      - name: Collect emulator diagnostics
        if: ${{ failure() }}
        run: |
          adb="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}/platform-tools/adb"
          mkdir -p emulator-diagnostics
          cp -r ~/.android/avd emulator-diagnostics/avd 2>/dev/null || true
          cp -r /tmp/android-* emulator-diagnostics/ 2>/dev/null || true
          cp /tmp/emulator-console.log emulator-diagnostics/ 2>/dev/null || true
          ls -la ~/.android/avd/test.avd > emulator-diagnostics/avd-contents.txt 2>&1 || true
          "$adb" devices -l > emulator-diagnostics/adb-devices.txt 2>&1 || true
          "$adb" -s emulator-5554 shell getprop > emulator-diagnostics/guest-getprop.txt 2>&1 || true
          "$adb" -s emulator-5554 logcat -d -v threadtime > emulator-diagnostics/guest-logcat.txt 2>&1 || true
          "$adb" -s emulator-5554 shell dmesg > emulator-diagnostics/guest-dmesg.txt 2>&1 || true
          ps -ef > emulator-diagnostics/host-processes.txt 2>&1 || true
          free -m > emulator-diagnostics/host-memory.txt 2>&1 || true
          df -h > emulator-diagnostics/host-disk.txt 2>&1 || true
      - name: Upload emulator diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.api-level }}_${{ matrix.arch }}_emulator-diagnostics
          path: emulator-diagnostics
          if-no-files-found: warn
          compression-level: 9
      - name: Upload outputs
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.api-level }}_${{ matrix.arch }}_outputs
          path: library/build/outputs
          compression-level: 9

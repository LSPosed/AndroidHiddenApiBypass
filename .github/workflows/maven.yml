name: Maven

on:
  workflow_dispatch:

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
    - name: Check out
      uses: actions/checkout@v7
      with:
        submodules: 'recursive'
        fetch-depth: 0
    - name: Set up JDK 21
      uses: actions/setup-java@v6
      with:
        distribution: 'temurin'
        java-version: '21'
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v6
    - name: Build with Gradle
      run: ./gradlew publish
      env:
        GIT_CONFIG_NOSYSTEM: true
        ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.maven_pgp_signingKey }}
        ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.maven_pgp_signingPassword }}
        ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.CentralPortalUsername }}
        ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.CentralPortalPassword }}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
